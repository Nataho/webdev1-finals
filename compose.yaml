services:
  eb-mysql:
    image: mysql:8.0
    container_name: eb-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "6967:3306"
    volumes:
      - eb-db-data:/var/lib/mysql
    networks:
      - eb-network
  eb-phpmyadmin:
    image: phpmyadmin
    container_name: eb-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: eb-mysql
    ports:
      - "6969:80"
    networks:
      - eb-network

volumes:
  eb-db-data:

networks:
  eb-network: